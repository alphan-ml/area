[project]
name = "area"
version = "0.1.0"
description = "AREA — Automated Research Evaluation Assistant. v0: GLP-1 manufacturer payments (CMS Open Payments) research agent."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # W-B1 shipped with zero required runtime dependencies: the CMS Open
    # Payments pull (src/area/pull_open_payments.py) uses only the standard
    # library. psycopg (the Neon/Postgres driver, for src/area/load_neon.py
    # and area.tools.query_tool) stays a dev/test-only dependency below
    # (imported lazily, same pattern as modelbench's boto3 -- see
    # model-bench D10): it's only needed once a real database is actually
    # queried (Gate 1), never for the guardrail tests or forecast pipeline.
    #
    # W-B2 adds three that ARE needed unconditionally, not just once a
    # secret exists, so they're core dependencies rather than dev extras:
    #  - sqlparse: area.tools.query_tool.validate_and_normalize() runs on
    #    every query_tool call, including the zero-secret guardrail tests
    #    (task-split section 10) -- it's the guardrail itself, not an
    #    optional integration.
    #  - pandas, statsmodels: area.forecast.models.ets() runs for every
    #    series `area forecast` evaluates (holdout_evaluate scores BOTH
    #    seasonal_naive and ets for every series, per CONTEXT.md's
    #    D-forecast-1), so these are needed the moment `area forecast` is
    #    invoked, not deferred behind a database connection.
    "sqlparse>=0.6",
    "pandas>=2.2",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    # Needed starting in W-B1, not only W-B4 as first planned: proving
    # load_neon.py's upsert-on-record_id idempotency needs a real
    # ON CONFLICT DO UPDATE against a real database -- a mock can't verify
    # that. tests/test_load_idempotent.py's DB-backed tests read
    # TEST_DATABASE_URL and skip cleanly (not silently pass) if it's unset.
    # load_neon.py itself still imports psycopg lazily at call time (see
    # its module docstring), so this is a dev/test dependency, not a
    # runtime one, until W-B4 wires the live Neon database.
    "psycopg[binary]>=3.1",
]

[project.scripts]
area = "area.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
